name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attest plugin files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            Grok Notes

            Public name is Grok Notes. Install folder stays YourVault/.obsidian/plugins/grok-mobile/ because the plugin id is grok-mobile. Leave data.json alone. Quit Obsidian and open it again.
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
